<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconnaissance Vocale Française</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #startBtn {
            background: #4CAF50;
            color: white;
        }

        #startBtn:hover:not(:disabled) {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        #stopBtn {
            background: #f44336;
            color: white;
        }

        #stopBtn:hover:not(:disabled) {
            background: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            font-weight: 500;
        }

        .status.listening {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.idle {
            background: #f5f5f5;
            color: #666;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .transcript-box {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .transcript-text {
            color: #333;
            line-height: 1.6;
            font-size: 16px;
        }

        .interim {
            color: #999;
            font-style: italic;
        }

        .clear-btn {
            background: #757575;
            color: white;
            width: 100%;
        }

        .clear-btn:hover:not(:disabled) {
            background: #616161;
        }

        .mic-icon {
            width: 20px;
            height: 20px;
        }

        .info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇫🇷 Reconnaissance Vocale</h1>
        <p class="subtitle">Parlez en français et voyez votre texte apparaître</p>

        <div class="controls">
            <button id="startBtn">
                <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
                Démarrer
            </button>
            <button id="stopBtn" disabled>
                <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="6" width="12" height="12"/>
                </svg>
                Arrêter
            </button>
        </div>

        <div id="status" class="status idle">
            Prêt à écouter
        </div>

        <div class="transcript-box">
            <div id="transcript" class="transcript-text">
                Votre transcription apparaîtra ici...
            </div>
        </div>

        <button id="clearBtn" class="clear-btn">Effacer le texte</button>

        <div class="info">
            💡 <strong>Astuce:</strong> Assurez-vous que votre microphone est activé et autorisez l'accès lorsque le navigateur le demande.
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const transcriptDiv = document.getElementById('transcript');
        const statusDiv = document.getElementById('status');

        let recognition;
        let finalTranscript = '';

        // Check if browser supports speech recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            
            recognition.lang = 'fr-FR';
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                statusDiv.textContent = '🎤 Écoute en cours...';
                statusDiv.className = 'status listening';
                startBtn.disabled = true;
                stopBtn.disabled = false;
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                transcriptDiv.innerHTML = 
                    '<span class="final">' + finalTranscript + '</span>' +
                    '<span class="interim">' + interimTranscript + '</span>';
            };

            recognition.onerror = (event) => {
                console.error('Error:', event.error);
                let errorMessage = 'Erreur: ';
                
                switch(event.error) {
                    case 'no-speech':
                        errorMessage += 'Aucune parole détectée';
                        break;
                    case 'audio-capture':
                        errorMessage += 'Microphone non disponible';
                        break;
                    case 'not-allowed':
                        errorMessage += 'Permission du microphone refusée';
                        break;
                    default:
                        errorMessage += event.error;
                }
                
                statusDiv.textContent = errorMessage;
                statusDiv.className = 'status error';
                startBtn.disabled = false;
                stopBtn.disabled = true;
            };

            recognition.onend = () => {
                statusDiv.textContent = 'Écoute arrêtée';
                statusDiv.className = 'status idle';
                startBtn.disabled = false;
                stopBtn.disabled = true;
            };

        } else {
            statusDiv.textContent = '❌ La reconnaissance vocale n\'est pas supportée par ce navigateur';
            statusDiv.className = 'status error';
            startBtn.disabled = true;
        }

        startBtn.addEventListener('click', async () => {
            if (recognition) {
                try {
                    console.log('Requesting microphone permission...');
                    
                    // First, explicitly request microphone permission using getUserMedia
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            sampleRate: 44100
                        } 
                    });
                    
                    console.log('Microphone permission granted!');
                    console.log('Audio tracks:', stream.getAudioTracks());
                    
                    // Stop the stream immediately (we just needed permission)
                    stream.getTracks().forEach(track => {
                        console.log('Stopping track:', track.label);
                        track.stop();
                    });
                    
                    // Small delay to ensure cleanup
                    await new Promise(resolve => setTimeout(resolve, 100));
                    
                    // Now start speech recognition
                    console.log('Starting speech recognition...');
                    recognition.start();
                    
                } catch (err) {
                    console.error('Detailed error:', err);
                    console.error('Error name:', err.name);
                    console.error('Error message:', err.message);
                    
                    let errorMsg = '❌ Erreur: ';
                    if (err.name === 'NotAllowedError') {
                        errorMsg += 'Permission refusée. Allez dans Préférences Système → Confidentialité → Microphone et activez Chrome.';
                    } else if (err.name === 'NotFoundError') {
                        errorMsg += 'Aucun microphone détecté';
                    } else {
                        errorMsg += err.message;
                    }
                    
                    statusDiv.textContent = errorMsg;
                    statusDiv.className = 'status error';
                }
            }
        });

        stopBtn.addEventListener('click', () => {
            if (recognition) {
                recognition.stop();
            }
        });

        clearBtn.addEventListener('click', () => {
            finalTranscript = '';
            transcriptDiv.innerHTML = 'Votre transcription apparaîtra ici...';
        });
    </script>
</body>
</html>
