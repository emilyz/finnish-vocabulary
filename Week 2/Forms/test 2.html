<!DOCTYPE html>
<html>
<head>
  <title>Sammy Script the Wizard</title>
</head>
<body>
  <h1 id="title">Hello World</h1>
  <button onclick="changeStyle()">Ask Sammy to Cast a Spell</button>

  <script>
    // Sammy Script’s magic spell
    function changeStyle() {
      let title = document.getElementById("title");  // finds the sign
      title.style.color = "red";                     // paints it red
      title.style.fontSize = "50px";                 // makes it big
    }
  </script>
</body>
</html>
