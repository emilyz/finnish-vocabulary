<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kadonnut kissa — The Lost Cat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useReducer } = React;

    // -------------------------------------------------------------------
    // ROOMS — hand-authored case forms (no runtime morphology)
    // -------------------------------------------------------------------
    const ROOMS = {
      kitchen:    { name: 'keittiö',    en: 'kitchen',     emoji: '🍳', inessive: 'keittiössä',     elative: 'keittiöstä',     illative: 'keittiöön'      },
      hallway:    { name: 'eteinen',    en: 'entryway',    emoji: '🚪', inessive: 'eteisessä',      elative: 'eteisestä',      illative: 'eteiseen'       },
      bedroom:    { name: 'makuuhuone', en: 'bedroom',     emoji: '🛏️', inessive: 'makuuhuoneessa', elative: 'makuuhuoneesta', illative: 'makuuhuoneeseen'},
      bathroom:   { name: 'kylpyhuone', en: 'bathroom',    emoji: '🛁', inessive: 'kylpyhuoneessa', elative: 'kylpyhuoneesta', illative: 'kylpyhuoneeseen'},
      livingroom: { name: 'olohuone',   en: 'living room', emoji: '🛋️', inessive: 'olohuoneessa',   elative: 'olohuoneesta',   illative: 'olohuoneeseen'  },
      garden:     { name: 'puutarha',   en: 'garden',      emoji: '🌿', inessive: 'puutarhassa',    elative: 'puutarhasta',    illative: 'puutarhaan'     },
    };

    const GRID_ORDER = ['kitchen', 'hallway', 'bedroom', 'bathroom', 'livingroom', 'garden'];

    // -------------------------------------------------------------------
    // ADJACENCY
    // -------------------------------------------------------------------
    const ADJACENCY = {
      kitchen:    ['hallway', 'bathroom'],
      hallway:    ['kitchen', 'bedroom', 'livingroom'],
      bedroom:    ['hallway', 'garden'],
      bathroom:   ['kitchen', 'livingroom'],
      livingroom: ['hallway', 'bathroom', 'garden'],
      garden:     ['bedroom', 'livingroom'],
    };

    const areAdjacent = (a, b) => ADJACENCY[a]?.includes(b) ?? false;
    const fi = (roomKey, kase) => ROOMS[roomKey][kase];
    const en = (roomKey) => ROOMS[roomKey].en;

    // -------------------------------------------------------------------
    // Witness verb templates — bilingual
    // -------------------------------------------------------------------
    const VERBS = {
      inessive: [
        { fi: 'Misu on',     en: 'Misu is in'           },
        { fi: 'Näin Misun',  en: 'I saw Misu in'        },
        { fi: 'Misu nukkuu', en: 'Misu is sleeping in'  },
      ],
      elative: [
        { fi: 'Misu juoksi',  en: 'Misu ran from'    },
        { fi: 'Misu tuli',    en: 'Misu came from'   },
        { fi: 'Misu hyppäsi', en: 'Misu jumped from' },
      ],
      illative: [
        { fi: 'Misu meni',      en: 'Misu went into'  },
        { fi: 'Misu juoksi',    en: 'Misu ran into'   },
        { fi: 'Misu piiloutui', en: 'Misu hid in'     },
      ],
    };

    const pickVerb = (kase, seed) => VERBS[kase][seed % VERBS[kase].length];

    const buildClue = (kase, roomKey, seed = 0) => {
      const v = pickVerb(kase, seed);
      return {
        case: kase,
        roomKey,
        fi: `${v.fi} ${fi(roomKey, kase)}.`,
        en: `${v.en} the ${en(roomKey)}.`,
      };
    };

    // -------------------------------------------------------------------
    // LEVEL DATA
    // -------------------------------------------------------------------
    const LEVELS = [
      {
        id: 1,
        title: 'Taso 1',
        intro: { fi: 'Rouva Virtanen näki Misun juuri äsken.',
                 en: 'Rouva Virtanen just saw Misu.' },
        turnBudget: 4,
        beats: [
          { case: 'inessive', room: 'bathroom', verbSeed: 2 },
        ],
      },
      {
        id: 2,
        title: 'Taso 2',
        intro: { fi: 'Rouva Virtanen kuuli juoksuaskeleita.',
                 en: 'Rouva Virtanen heard running footsteps.' },
        turnBudget: 5,
        beats: [
          { case: 'elative',  room: 'kitchen', verbSeed: 0 },
          { case: 'illative', room: 'hallway', verbSeed: 0 },
        ],
      },
      {
        id: 3,
        title: 'Taso 3',
        intro: { fi: 'Misu lähti olohuoneesta.',
                 en: 'Misu took off from the living room.' },
        turnBudget: 5,
        beats: [
          { case: 'elative',  room: 'livingroom', verbSeed: 0 },
          { case: 'illative', room: 'garden',     verbSeed: 0 },
        ],
      },
      {
        id: 4,
        title: 'Taso 4',
        intro: { fi: 'Pitkä takaa-ajo — kolme käännöstä.',
                 en: 'A long chase — three turns.' },
        turnBudget: 6,
        beats: [
          { case: 'elative',  room: 'kitchen',    verbSeed: 0 },
          { case: 'illative', room: 'livingroom', verbSeed: 0 },
          { case: 'inessive', room: 'garden',     verbSeed: 2 },
        ],
      },
      {
        id: 5,
        title: 'Taso 5',
        intro: { fi: 'Vihje on epäselvä — sitouduthan tulkintaasi.',
                 en: 'The clue is unclear — commit to your interpretation.' },
        turnBudget: 6,
        beats: [
          { case: 'elative',  room: 'hallway',    verbSeed: 0 },
          { case: 'illative', room: 'livingroom', verbSeed: 1 },
          { case: 'inessive', room: 'garden',     verbSeed: 0 },
        ],
      },
    ];

    // -------------------------------------------------------------------
    // Reducer / resolver
    // -------------------------------------------------------------------
    const buildBeatClue = beat => buildClue(beat.case, beat.room, beat.verbSeed ?? 0);

    function initialStateForLevel(levelIndex) {
      const level = LEVELS[levelIndex];
      const firstBeat = level.beats[0];
      const lastBeat = level.beats[level.beats.length - 1];
      const firstClue = buildBeatClue(firstBeat);
      return {
        levelIndex,
        turnsRemaining: level.turnBudget,
        catLocation: lastBeat.room,
        beatIndex: 0,
        currentClue: firstClue,
        witnessLine: { fi: firstClue.fi, en: firstClue.en },
        history: [
          { type: 'intro', fi: level.intro.fi, en: level.intro.en },
          { type: 'clue',  fi: firstClue.fi,   en: firstClue.en   },
        ],
        status: 'playing',
        celebration: null,
      };
    }

    function reducer(state, action) {
      switch (action.type) {
        case 'click_room':
          return resolveClick(state, action.roomKey);
        case 'next_level': {
          const next = state.levelIndex + 1;
          if (next >= LEVELS.length) return { ...state, status: 'campaign_complete' };
          return initialStateForLevel(next);
        }
        case 'restart_level':
          return initialStateForLevel(state.levelIndex);
        case 'restart_campaign':
          return initialStateForLevel(0);
        default:
          return state;
      }
    }

    function resolveClick(state, clickedRoom) {
      if (state.status !== 'playing') return state;

      const level = LEVELS[state.levelIndex];
      const clue = state.currentClue;
      const beat = level.beats[state.beatIndex];
      const isLastBeat = state.beatIndex === level.beats.length - 1;
      const nextBeat = isLastBeat ? null : level.beats[state.beatIndex + 1];

      const history = [...state.history, {
        type: 'click',
        fi: `▸ Sinä menit ${fi(clickedRoom, 'illative')}.`,
        en: `▸ You went into the ${en(clickedRoom)}.`,
      }];

      // ----- INESSIVE: cat is in clue.roomKey -----
      if (clue.case === 'inessive') {
        if (clickedRoom === clue.roomKey) {
          return finish(state, history, [{
            type: 'witness',
            fi: 'Sinä löysit Misun! 🐈',
            en: 'You found Misu! 🐈',
          }]);
        }
        return spendTurn(state, history, {
          fi: `Ei, Misu ei ole ${fi(clickedRoom, 'inessive')}. Misu on ${fi(clue.roomKey, 'inessive')}.`,
          en: `No, Misu isn't in the ${en(clickedRoom)}. Misu is in the ${en(clue.roomKey)}.`,
        });
      }

      // ----- ELATIVE: cat WAS in clue.roomKey, has left -----
      if (clue.case === 'elative') {
        const v = pickVerb('elative', beat.verbSeed ?? 0);
        if (clickedRoom === clue.roomKey) {
          return spendTurn(state, history, {
            fi: `Ei, Misu ei ole enää ${fi(clue.roomKey, 'inessive')}. ${v.fi} ${fi(clue.roomKey, 'elative')}.`,
            en: `No, Misu isn't in the ${en(clue.roomKey)} anymore. ${v.en} the ${en(clue.roomKey)}.`,
          });
        }
        if (areAdjacent(clue.roomKey, clickedRoom)) {
          if (!nextBeat) {
            return finish(state, history, [{
              type: 'witness',
              fi: 'Tassunjäljet päättyvät tähän. Misu on löytynyt! 🐈',
              en: 'The paw prints end here. Misu has been found! 🐈',
            }]);
          }
          const nextClue = buildBeatClue(nextBeat);
          return advanceBeat(state, history, {
            fi: `Hyvä! Tässä on tassunjälki. ${nextClue.fi}`,
            en: `Good! Here's a paw print. ${nextClue.en}`,
          }, nextClue);
        }
        return spendTurn(state, history, {
          fi: `Ei, Misu ei ollut ${fi(clickedRoom, 'inessive')}. ${v.fi} ${fi(clue.roomKey, 'elative')}.`,
          en: `No, Misu wasn't in the ${en(clickedRoom)}. ${v.en} the ${en(clue.roomKey)}.`,
        });
      }

      // ----- ILLATIVE: cat went into clue.roomKey -----
      if (clue.case === 'illative') {
        const v = pickVerb('illative', beat.verbSeed ?? 0);
        if (clickedRoom === clue.roomKey) {
          if (isLastBeat) {
            return finish(state, history, [{
              type: 'witness',
              fi: 'Tässä on tassunjälki… ja tässä on Misu! 🐈',
              en: "Here's a paw print… and here's Misu! 🐈",
            }]);
          }
          const nextClue = buildBeatClue(nextBeat);
          return advanceBeat(state, history, {
            fi: `Tässä on tassunjälki. ${nextClue.fi}`,
            en: `Here's a paw print. ${nextClue.en}`,
          }, nextClue);
        }
        return spendTurn(state, history, {
          fi: `Ei, Misu ei ole ${fi(clickedRoom, 'inessive')}. ${v.fi} ${fi(clue.roomKey, 'illative')}.`,
          en: `No, Misu isn't in the ${en(clickedRoom)}. ${v.en} the ${en(clue.roomKey)}.`,
        });
      }

      return state;
    }

    function spendTurn(state, history, witnessLine) {
      const newHistory = [...history, { type: 'witness', ...witnessLine }];
      const turns = state.turnsRemaining - 1;
      if (turns <= 0) {
        const failLine = {
          fi: 'Voi ei… Misu karkasi naapurin pihalle.',
          en: "Oh no… Misu escaped to the neighbour's yard.",
        };
        return {
          ...state,
          turnsRemaining: 0,
          witnessLine: failLine,
          history: [...newHistory, { type: 'witness', ...failLine }],
          status: 'lost',
        };
      }
      return {
        ...state,
        turnsRemaining: turns,
        witnessLine,
        history: newHistory,
      };
    }

    function advanceBeat(state, history, witnessLine, nextClue) {
      const newHistory = [
        ...history,
        { type: 'witness', ...witnessLine },
        { type: 'clue',    fi: nextClue.fi, en: nextClue.en },
      ];
      return {
        ...state,
        beatIndex: state.beatIndex + 1,
        currentClue: nextClue,
        witnessLine,
        history: newHistory,
      };
    }

    function finish(state, history, extraEntries) {
      const newHistory = [...history, ...extraEntries.map(e => ({ type: 'witness', ...e }))];
      const last = extraEntries[extraEntries.length - 1];
      const replay = newHistory.filter(
        h => h.type === 'intro' || h.type === 'clue' || h.type === 'witness'
      );
      return {
        ...state,
        history: newHistory,
        witnessLine: { fi: last.fi, en: last.en },
        status: 'won',
        celebration: { replay },
      };
    }

    // -------------------------------------------------------------------
    // Subcomponents
    // -------------------------------------------------------------------
    function TurnIndicator({ remaining, total }) {
      const dots = [];
      for (let i = 0; i < total; i++) {
        const filled = i < remaining;
        dots.push(
          <span
            key={i}
            className={
              'inline-block w-3 h-3 rounded-full mx-0.5 ' +
              (filled ? 'bg-amber-500' : 'bg-stone-300 border border-stone-400')
            }
            aria-hidden="true"
          />
        );
      }
      return (
        <div className="flex items-center" aria-label={`${remaining} of ${total} turns remaining`}>
          {dots}
        </div>
      );
    }

    function RoomTile({ roomKey, onClick, disabled, highlighted }) {
      const room = ROOMS[roomKey];
      const base =
        'flex flex-col items-center justify-center rounded-2xl border-2 p-4 h-32 transition-all select-none ';
      const interactive = disabled
        ? 'cursor-not-allowed opacity-60 '
        : 'cursor-pointer hover:border-amber-500 hover:bg-amber-50 hover:-translate-y-0.5 ';
      const tone = highlighted
        ? 'bg-amber-100 border-amber-500 '
        : 'bg-white border-stone-300 ';
      return (
        <button
          type="button"
          disabled={disabled}
          onClick={() => onClick(roomKey)}
          className={base + interactive + tone}
        >
          <span className="text-4xl mb-1" aria-hidden="true">{room.emoji}</span>
          <span className="text-sm font-medium text-stone-700">{room.name}</span>
          <span className="text-xs text-stone-400">{room.en}</span>
        </button>
      );
    }

    function ApartmentGrid({ onRoomClick, disabled, foundRoom }) {
      return (
        <div className="grid grid-cols-3 gap-3">
          {GRID_ORDER.map(key => (
            <RoomTile
              key={key}
              roomKey={key}
              onClick={onRoomClick}
              disabled={disabled}
              highlighted={key === foundRoom}
            />
          ))}
        </div>
      );
    }

    function WitnessPanel({ line }) {
      return (
        <div className="bg-white rounded-2xl border-2 border-stone-300 p-4 shadow-sm">
          <div className="flex items-start gap-3">
            <div className="text-4xl" aria-hidden="true">👵</div>
            <div className="flex-1">
              <div className="text-xs uppercase tracking-wider text-stone-500 mb-1">
                Rouva Virtanen
              </div>
              <p className="text-lg font-medium text-stone-900 leading-snug">
                "{line.fi}"
              </p>
              <p className="text-sm text-stone-500 italic mt-1 leading-snug">
                {line.en}
              </p>
            </div>
          </div>
        </div>
      );
    }

    function HistoryLog({ entries }) {
      return (
        <div className="bg-stone-50 rounded-2xl border border-stone-200 p-3 max-h-72 overflow-y-auto">
          <div className="text-xs uppercase tracking-wider text-stone-500 mb-2">Tapahtumat · Log</div>
          <ul className="space-y-2 text-sm">
            {entries.map((e, i) => {
              const fiTone =
                e.type === 'click' ? 'text-stone-600 italic' : 'text-stone-900';
              return (
                <li key={i}>
                  <div className={fiTone}>{e.fi}</div>
                  <div className="text-xs text-stone-400 italic">{e.en}</div>
                </li>
              );
            })}
          </ul>
        </div>
      );
    }

    function VictoryOverlay({ state, dispatch }) {
      const level = LEVELS[state.levelIndex];
      const isLast = state.levelIndex === LEVELS.length - 1;
      return (
        <div className="absolute inset-0 bg-stone-900/70 flex items-center justify-center rounded-3xl p-6 z-10">
          <div className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-xl">
            <div className="text-center mb-4">
              <div className="text-5xl mb-2">🐈</div>
              <h2 className="text-2xl font-bold text-stone-900">Löysit Misun!</h2>
              <p className="text-sm text-stone-500">You found Misu! · {level.title} valmis</p>
            </div>
            <div className="bg-stone-50 rounded-xl p-3 mb-4 max-h-60 overflow-y-auto">
              <div className="text-xs uppercase tracking-wider text-stone-500 mb-2">
                Tarinan kulku · The story
              </div>
              <ul className="space-y-2 text-sm text-stone-800">
                {state.celebration.replay.map((e, i) => (
                  <li key={i}>
                    <div>{e.fi}</div>
                    <div className="text-xs text-stone-500 italic">{e.en}</div>
                  </li>
                ))}
              </ul>
            </div>
            <div className="flex gap-2 justify-end">
              <button
                onClick={() => dispatch({ type: 'restart_level' })}
                className="px-4 py-2 rounded-lg border border-stone-300 text-stone-700 hover:bg-stone-100"
              >
                Pelaa uudelleen
              </button>
              {isLast ? (
                <button
                  onClick={() => dispatch({ type: 'restart_campaign' })}
                  className="px-4 py-2 rounded-lg bg-amber-500 text-white hover:bg-amber-600"
                >
                  Aloita alusta
                </button>
              ) : (
                <button
                  onClick={() => dispatch({ type: 'next_level' })}
                  className="px-4 py-2 rounded-lg bg-amber-500 text-white hover:bg-amber-600"
                >
                  Seuraava taso →
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function FailureOverlay({ dispatch }) {
      return (
        <div className="absolute inset-0 bg-stone-900/70 flex items-center justify-center rounded-3xl p-6 z-10">
          <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl text-center">
            <div className="text-5xl mb-2">🌧️</div>
            <h2 className="text-2xl font-bold text-stone-900 mb-1">Misu karkasi…</h2>
            <p className="text-stone-600 mb-4">
              Vuorot loppuivat. Yritetäänkö uudelleen?<br />
              <span className="text-sm text-stone-500 italic">Out of turns. Try again?</span>
            </p>
            <div className="flex gap-2 justify-center">
              <button
                onClick={() => dispatch({ type: 'restart_level' })}
                className="px-4 py-2 rounded-lg bg-amber-500 text-white hover:bg-amber-600"
              >
                Yritä uudelleen
              </button>
              <button
                onClick={() => dispatch({ type: 'restart_campaign' })}
                className="px-4 py-2 rounded-lg border border-stone-300 text-stone-700 hover:bg-stone-100"
              >
                Alusta
              </button>
            </div>
          </div>
        </div>
      );
    }

    function CampaignCompleteOverlay({ dispatch }) {
      return (
        <div className="absolute inset-0 bg-stone-900/70 flex items-center justify-center rounded-3xl p-6 z-10">
          <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl text-center">
            <div className="text-5xl mb-2">🏆</div>
            <h2 className="text-2xl font-bold text-stone-900 mb-1">Kaikki tasot valmiit!</h2>
            <p className="text-stone-600 mb-4">
              Hienoa työtä, etsivä.<br />
              <span className="text-sm text-stone-500 italic">All levels complete. Nice work, detective.</span>
            </p>
            <button
              onClick={() => dispatch({ type: 'restart_campaign' })}
              className="px-4 py-2 rounded-lg bg-amber-500 text-white hover:bg-amber-600"
            >
              Pelaa alusta
            </button>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------
    // Main
    // -------------------------------------------------------------------
    function LostCatGame() {
      const [state, dispatch] = useReducer(reducer, 0, initialStateForLevel);
      const level = LEVELS[state.levelIndex];

      const onRoomClick = (roomKey) => dispatch({ type: 'click_room', roomKey });

      const overlay =
        state.status === 'won'                ? <VictoryOverlay state={state} dispatch={dispatch} /> :
        state.status === 'lost'               ? <FailureOverlay dispatch={dispatch} /> :
        state.status === 'campaign_complete'  ? <CampaignCompleteOverlay dispatch={dispatch} /> :
                                                null;

      return (
        <div className="max-w-5xl mx-auto p-4 md:p-8">
          <header className="flex items-end justify-between mb-4">
            <div>
              <h1 className="text-3xl font-bold text-stone-900">Kadonnut kissa</h1>
              <p className="text-sm text-stone-500">The Lost Cat · {level.title}</p>
            </div>
            <div className="flex flex-col items-end">
              <span className="text-xs uppercase tracking-wider text-stone-500 mb-1">Vuorot · Turns</span>
              <TurnIndicator remaining={state.turnsRemaining} total={level.turnBudget} />
            </div>
          </header>

          <div className="relative bg-white/60 rounded-3xl p-4 md:p-6 border border-stone-200 shadow-inner">
            <div className="grid md:grid-cols-[1fr_320px] gap-4">
              <div>
                <ApartmentGrid
                  onRoomClick={onRoomClick}
                  disabled={state.status !== 'playing'}
                  foundRoom={state.status === 'won' ? state.catLocation : null}
                />
              </div>
              <div className="flex flex-col gap-3">
                <WitnessPanel line={state.witnessLine} />
                <HistoryLog entries={state.history} />
              </div>
            </div>
            {overlay}
          </div>

          <footer className="mt-4 flex items-center justify-between text-xs text-stone-500">
            <span>Klikkaa huonetta toimiaksesi vihjeen mukaan. · Click a room to act on the clue.</span>
            <button
              onClick={() => dispatch({ type: 'restart_level' })}
              className="text-stone-600 hover:text-stone-900 underline"
            >
              Aloita taso alusta
            </button>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LostCatGame />);
  </script>
</body>
</html>
